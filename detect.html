<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>CODE DETECT | THREE PITCH</title>
  <link rel="stylesheet" href="./style.css?v=40">
</head>
<body>
  <main class="app detect-app">
    <header class="brand">
      <div class="mini-logo" aria-hidden="true"><span>THREE</span><strong>PITCH</strong></div>
      <div class="brand-copy"><p>CODE DETECT MODE</p><h1>CODE DETECT</h1><span>聞こえた音と前後進行から候補生成</span></div>
      <button id="closeDetectButton" class="mode-button" type="button">閉じる</button>
    </header>
    <section class="detect-layout">
      <section class="control-card detect-input-card">
        <div class="section-title"><span>01</span><div><h2>HEARD NOTES</h2><p>聞こえた音を複数選択</p></div></div>
        <div id="heardNotesGrid" class="notes-grid"></div>
        <div class="detect-tools"><button id="clearHeardButton" class="utility-button" type="button">選択解除</button><span id="heardCount">0音選択</span></div>
      </section>
      <section class="control-card context-card">
        <div class="section-title"><span>02</span><div><h2>CONTEXT</h2><p>前後コードは任意</p></div></div>
        <div class="context-grid">
          <label>前のコード<select id="previousChord"></select></label>
          <label>次のコード<select id="nextChord"></select></label>
        </div>
        <p class="context-note">未入力なら聞こえた音だけで順位付けし、入力時は共通音・ルート進行・解決方向を加味します。</p>
      </section>
      <section class="control-card candidates-card" aria-live="polite">
        <div class="section-title"><span>03</span><div><h2>CANDIDATES</h2><p>可能性が高い順</p></div></div>
        <div id="candidateList" class="candidate-list"></div>
      </section>
    </section>
  </main>
  <script src="./detect.js?v=40"></script>
</body>
</html>
